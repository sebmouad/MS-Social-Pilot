# Checks every push and pull request the way the server's deploy does, plus the two things the deploy cannot see:
# lint errors, and a Prisma schema that no longer matches the database the migrations build.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Migrations apply to an empty database
        run: for f in prisma/migrations/*/migration.sql; do PGPASSWORD=ci psql -h 127.0.0.1 -U ci -d ci -v ON_ERROR_STOP=1 -q -f "$f"; done
      - name: Prisma schema matches the migrated database
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: No critical advisory in what runs in production
        run: npm audit --omit=dev --audit-level=critical
      - run: npm run build
