<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1877f2">
<title>Offline · MS Social Pilot</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f0f2f5; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #050505; }
  main { max-width: 22rem; margin: 1rem; padding: 2rem 1.5rem; background: #fff; border-radius: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.1); text-align: center; }
  img { width: 64px; height: 64px; }
  h1 { font-size: 1.25rem; margin: 1rem 0 .5rem; }
  p { color: #65676b; line-height: 1.5; margin: 0 0 1.25rem; }
  button { font: inherit; font-weight: 600; color: #fff; background: #1877f2; border: 0; border-radius: 6px; padding: .6rem 1.2rem; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/icon-192.png" alt="">
  <h1>You are offline</h1>
  <p>Your scheduled posts still go out: they are sent from the server, not from this phone. Reconnect to see them.<br><br>Vous êtes hors ligne. Vos publications programmées partent quand même, depuis le serveur.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
