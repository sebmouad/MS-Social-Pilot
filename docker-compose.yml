# Development and single-host production stack.
#
# Three services from one image: the web app, the scheduler worker, and
# Postgres. The worker is a separate container running the same code with a
# different command — that separation is why a slow publish never blocks a
# page load.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-social_pilot}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Exposed for local tooling (psql, Prisma Studio). Remove in production.
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-social_pilot}?schema=public
      # Fixed inside the container whatever .env says, so the mapping above and
      # the healthcheck below stay true.
      PORT: '3000'
      HOST: '0.0.0.0'
    ports:
      # Host side is configurable, container side is not: inside the network the
      # app is always on 3000, so the healthcheck and the worker do not have to
      # know what an operator chose outside. 80 on the host, because HTTPS is
      # terminated in front of this stack rather than inside it.
      - '${APP_PORT:-80}:3000'
    volumes:
      - media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    # Migrations run here rather than in the worker so that two containers
    # starting together cannot race to apply the same migration.
    command: sh -c "npx prisma migrate deploy && npm start"
    # node rather than curl or wget: this image is node:22-slim, which ships
    # neither. start_period covers the migration, which is the slow part of a
    # first boot and must not count as a failure while it runs.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-social_pilot}?schema=public
    volumes:
      # The same media volume: the worker reads uploaded files to publish them.
      - media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      # Healthy, not merely started: `web` applies the migrations, and starting
      # is not the same as having finished them. Waiting only for the container
      # left the worker polling tables that did not exist yet, crashing and
      # restarting until the migration landed — self-healing, but a minute of
      # alarming logs on every first boot.
      web:
        condition: service_healthy
    command: npm run worker

volumes:
  postgres-data:
  media:
